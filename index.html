<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ติวซาเลเซียนกันนน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>📘 ติวซาเลเซียนกันนน</h1>

<p class="credit">
จัดทำโดย <b>ภาคิน นาคแก้ว</b>
</p>

<p class="msg">
ขอให้ทุกคนสู้ๆ<br>
เว็บนี้ทำให้ ฟลุ๊ค นิวตั้น ฮังเล และ จิน ❤️
</p>

<div class="warning">
⚠️ อาจมีข้อผิดพลาดทางระบบตรวจ
</div>

<div class="info">

<label>ชื่อ - สกุล</label>
<input id="name" placeholder="กรอกชื่อ">

<label>ชั้น</label>
<input id="classroom" placeholder="เช่น ม.1/1">

<label>เลขประจำตัวนักเรียน</label>
<input id="studentId" placeholder="เช่น 28777">

</div>

<div id="quiz"></div>

<button onclick="checkQuiz()">
ส่งคำตอบ
</button>

<div id="result"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
